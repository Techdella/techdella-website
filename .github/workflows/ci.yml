# Lint, build and test on every push/PR (§0.8, §16).
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', tools: composer:v2, coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: composer lint
      - run: composer test
      - run: npm run lint
      - name: No removed fonts anywhere (§16)
        run: "! grep -rniE 'syne|outfit|manrope' wp-content/ --include=*.php --include=*.css --include=*.js --include=*.json"

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: docker compose up -d --build
      - run: ./docker/bin/setup.sh
      - run: npm run test:e2e
      - run: npm run test:lighthouse
      - if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report/, retention-days: 14 }
