# main → staging; tag v* → production after manual approval (§5.3).
# Required secrets: HOSTINGER_SSH_KEY, HOSTINGER_SSH_HOST, HOSTINGER_SSH_PORT, HOSTINGER_SSH_USER,
# PATH_MARKETING, PATH_JOURNAL, PATH_STUDIOS, PATH_STAGING, STAGING_URL, STAGING_BASIC_AUTH (user:pass).
# Configure the "production" environment with required reviewers so production waits for approval.
name: Deploy
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    env:
      TARGET: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      PATH_MARKETING: ${{ secrets.PATH_MARKETING }}
      PATH_JOURNAL: ${{ secrets.PATH_JOURNAL }}
      PATH_STUDIOS: ${{ secrets.PATH_STUDIOS }}
      PATH_STAGING: ${{ secrets.PATH_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: SSH key
        run: |
          mkdir -p ~/.ssh && echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$HOSTINGER_SSH_PORT" "$HOSTINGER_SSH_HOST" >> ~/.ssh/known_hosts
      - run: ./scripts/deploy.sh "$TARGET"
      - name: Staging must never be indexed (§5.3)
        if: env.TARGET == 'staging'
        run: |
          H=$(curl -sI -u "${{ secrets.STAGING_BASIC_AUTH }}" "${{ secrets.STAGING_URL }}" | tr -d '\r')
          echo "$H" | grep -i '^x-robots-tag:.*noindex'
          test "$(curl -s -o /dev/null -w '%{http_code}' "${{ secrets.STAGING_URL }}")" = "401"
      - name: Smoke tests
        run: |
          npx playwright install --with-deps chromium
          if [ "$TARGET" = production ]; then
            MARKETING_URL=https://techdella.com JOURNAL_URL=https://blog.techdella.com STUDIOS_URL=https://studios.techdella.com npm run test:smoke
          else
            MARKETING_URL="${{ secrets.STAGING_URL }}" npm run test:smoke -- --project=desktop
          fi
